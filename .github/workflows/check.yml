name: Check migrations

# PR のたびに、空のデータベースへ全マイグレーションを流して壊れていないか確かめる
on:
  pull_request:
    paths: ["supabase/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset
