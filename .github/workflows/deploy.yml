name: Deploy migrations

# main にマイグレーションが入ったら、本番の Supabase に適用する
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Supabase の Connect > Session pooler の接続文字列（パスワード入り）
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
